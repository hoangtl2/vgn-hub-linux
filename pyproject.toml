[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vgn-hub-linux"
version = "0.1.0"
description = "Lightweight native Linux GTK4 + WebKitGTK6 GUI and HID CLI for VGN mice (Dragonfly 3 Ultra & siblings)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vgn-hub = "vgn_hub.cli:main"
vgn-hub-gui = "vgn_hub.gui:main"

[tool.setuptools.packages.find]
include = ["vgn_hub*"]

[tool.setuptools.package-data]
vgn_hub = ["web/*"]
