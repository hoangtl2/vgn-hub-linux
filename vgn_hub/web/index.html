<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VGN HUB Linux</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-glass view-lobby">
  <div class="bg-ambient" aria-hidden="true">
    <div id="bg-preset-layer" class="bg-preset-layer wp-preset-vgn-crimson"></div>
    <div id="bg-custom-layer" class="bg-custom-layer" hidden></div>
    <div id="bg-dim-layer" class="bg-dim-layer"></div>
    <div id="bg-watermark-layer" class="bg-watermark-layer">
      <span class="bg-watermark-line">POWER ON</span>
      <span class="bg-watermark-line">GAME ON</span>
    </div>
  </div>

  <div class="app-shell">
    <!-- Top Header -->
    <header class="topbar">
      <div class="brand-group">
        <button id="btn-back-lobby" class="back-lobby-btn" hidden>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          <span data-i18n="backToDevices">Thiết bị</span>
        </button>

        <div id="brand-home" class="brand" role="button" tabindex="0">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 180 104" width="44" height="25" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="vgnGoldFill" x1="12%" y1="0%" x2="88%" y2="100%">
                  <stop offset="0%" stop-color="#fff4c4"/>
                  <stop offset="22%" stop-color="#f3cf68"/>
                  <stop offset="45%" stop-color="#b88224"/>
                  <stop offset="66%" stop-color="#fce392"/>
                  <stop offset="86%" stop-color="#cfa03b"/>
                  <stop offset="100%" stop-color="#8f5e14"/>
                </linearGradient>
                <linearGradient id="vgnGoldRim" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.72"/>
                  <stop offset="50%" stop-color="#f0c85c" stop-opacity="0.28"/>
                  <stop offset="100%" stop-color="#8c5a12" stop-opacity="0.45"/>
                </linearGradient>
              </defs>
              <g fill="url(#vgnGoldFill)" stroke="url(#vgnGoldRim)" stroke-width="1.1" stroke-linejoin="miter">
                <polygon points="0,0 59.9,27.9 63.6,32.4 79.8,38.4 84.6,34.5 83.5,40 69.9,56.8 70.1,51.2 65.4,60.6 49.7,61.2 34.4,67.9 67.6,43.9 47.4,45.3 28.5,27.6 43.9,30.5 23.2,22 15.2,11.8"/>
                <polygon points="180,0 120.1,27.9 116.4,32.4 100.2,38.4 95.4,34.5 96.5,40 110.1,56.8 109.9,51.2 114.6,60.6 130.3,61.2 145.6,67.9 112.4,43.9 132.6,45.3 151.5,27.6 136.1,30.5 156.8,22 164.8,11.8"/>
                <polygon points="90,24 95.8,51.8 92.4,63.4 95.4,60.6 90,104 84.6,60.6 87.6,63.4 84.2,51.8"/>
              </g>
            </svg>
          </div>
          <span class="brand-name">VGN HUB</span>
          <span class="brand-tag">LINUX</span>
        </div>
      </div>

      <div class="topbar-actions">
        <div id="conn-pill" class="pill pill-muted">...</div>
        <div id="battery-pill" class="pill pill-bat" hidden>100%</div>
        <button id="btn-refresh" class="icon-btn" title="Refresh">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
        <button id="btn-wallpaper" class="wp-trigger-btn" title="App Wallpaper">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
          <span id="wp-trigger-swatch" class="wp-trigger-swatch"></span>
          <span data-i18n="wallpaperBtn">Hình nền</span>
        </button>
        <button id="btn-theme" class="seg-btn" title="Glass / Solid">Glass</button>
        <button id="btn-lang" class="seg-btn" title="Tiếng Việt / English">VI</button>
      </div>
    </header>

    <!-- Entry Device Lobby Stage -->
    <main class="lobby-stage" id="lobby-stage">
      <div class="loading-box">
        <div class="spinner"></div>
        <p data-i18n="connecting">Đang kết nối thiết bị...</p>
      </div>
    </main>

    <!-- 3-Column Editor Workspace -->
    <div class="workspace" id="editor-workspace">
      <!-- Left Sidebar -->
      <aside class="sidebar-left">
        <div class="device-card">
          <div class="device-thumb" id="sidebar-thumb"></div>
          <div class="device-meta">
            <div class="device-title" id="sidebar-device-name">Dragonfly 3 Ultra</div>
            <div class="device-sub">
              <span id="sidebar-bat">100%</span>
              <span>·</span>
              <span id="sidebar-mode">Wired USB</span>
            </div>
            <div class="device-fw" id="sidebar-fw">fw v0807 · PAW3950</div>
          </div>
        </div>

        <div class="nav-section-label" data-i18n="navSection">Mouse</div>
        <nav class="nav-list" id="nav-list"></nav>

        <div class="sidebar-footer">
          <button id="btn-demo-toggle" class="ghost-btn full-width"></button>
        </div>
      </aside>

      <!-- Center Main Stage -->
      <main class="main-stage" id="main-stage">
        <div class="loading-box" id="loading-box">
          <div class="spinner"></div>
          <p data-i18n="connecting">Đang kết nối thiết bị...</p>
        </div>
      </main>

      <!-- Right Sidebar -->
      <aside class="sidebar-right">
        <div class="right-title" data-i18n="profileHeader">Profile</div>
        <div class="profile-list" id="profile-list"></div>

        <div class="telemetry-card">
          <div class="telemetry-title" data-i18n="telemetryHeader">Thông số nhanh</div>
          <div class="telemetry-grid" id="telemetry-grid"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Top-Right Wallpaper Studio Popover -->
  <aside id="wallpaper-popover" class="wp-popover" hidden aria-label="Wallpaper settings"></aside>

  <!-- Add Device Scanner Modal -->
  <div id="add-device-backdrop" class="modal-backdrop" hidden>
    <div class="modal-card add-device-card" id="add-device-card"></div>
  </div>

  <!-- Toast & Confirmation Modal -->
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal-card">
      <h3 id="modal-title"></h3>
      <p id="modal-body"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary"></button>
        <button id="modal-confirm" class="btn-danger"></button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="mouse_svg.js"></script>
  <script src="app.js"></script>
</body>
</html>
